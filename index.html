<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>transgende.rs</title>

  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .trans-flag {
      width: 100vw;
      height: 100dvh;
      background: linear-gradient(
        to bottom,
        #5BCEFA 0%,   #5BCEFA 20%,
        #F5A9B8 20%,  #F5A9B8 40%,
        #FFFFFF 40%,  #FFFFFF 60%,
        #F5A9B8 60%,  #F5A9B8 80%,
        #5BCEFA 80%,  #5BCEFA 100%
      );
      display: flex;
      flex-direction: column;
    }

    .stripe {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 0 1rem;
      min-height: 0;
      overflow: hidden;
    }

    .flag-text {
      font-weight: 900;
      font-size: clamp(2.1rem, 9vw, 4.8rem);
      color: #efefef;
      letter-spacing: -0.05em;
      text-align: center;
      margin: 0;
      line-height: 0.95;
      max-width: 94%;
      white-space: normal;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }

    .links-container {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
      padding: 0 0.5rem;
    }

    .flag-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      min-width: 48px;
      font-weight: 800;
      font-size: clamp(0.95rem, 4.2vw, 1.4rem);
      color: #4b4b4b;
      text-decoration: none;
      padding: 0.85rem 1.2rem;
      background: rgba(255, 255, 255, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.95);
      border-radius: 14px;
      box-shadow: none;
      transition: transform 0.2s ease, background 0.2s ease;
      white-space: nowrap;
      text-align: center;
      line-height: 1.05;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .flag-link:hover {
      background: rgba(255, 255, 255, 1);
      transform: translateY(-1px);
    }

    .flag-link:active {
      transform: translateY(0);
    }

    .bottom-blue {
      position: relative;
    }

    .copyright {
      position: absolute;
      bottom: 0.75rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(0.8rem, 3vw, 1rem);
      font-weight: 600;
      color: rgba(255, 255, 255, 0.9);
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }

    @media (max-width: 480px) {
      .stripe {
        padding: 0 0.75rem;
      }

      .flag-text {
        font-size: clamp(2.2rem, 10vw, 3.8rem);
      }

      .links-container {
        flex-direction: column;
        gap: 0.7rem;
      }

      .flag-link {
        width: min(100%, 280px);
        font-size: clamp(0.95rem, 4.8vw, 1.2rem);
        padding: 0.8rem 1rem;
      }
    }

    @media (max-width: 360px) {
      .flag-text {
        font-size: clamp(2rem, 9vw, 3.2rem);
      }

      .flag-link {
        width: 100%;
      }
    }
  </style>
</head>
<body>
  <div class="trans-flag" role="img" aria-label="trans flag">
    <div class="stripe"></div>
    <div class="stripe"></div>

    <div class="stripe">
      <h1 class="flag-text">transgende.rs &lt;3</h1>
    </div>

    <div class="stripe">
      <nav class="links-container" aria-label="resources">
        <a href="https://glaad.org/transgender/resources/" class="flag-link" target="_blank" rel="noopener">GLAAD</a>
        <a href="https://www.hrc.org/resources/transgender" class="flag-link" target="_blank" rel="noopener">HRC</a>
        <a href="https://www.pointofpride.org/" class="flag-link" target="_blank" rel="noopener">Point of Pride</a>
      </nav>
    </div>

    <div class="stripe bottom-blue">
      <div class="copyright">© 2026 transgende.rs</div>
    </div>
  </div>
</body>
</html>
