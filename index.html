<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CclipPath id='heart'%3E%3Cpath d='M32 57L8 33c-7-7-7-18 0-25s18-7 24-1c6-6 17-6 24 1s7 18 0 25L32 57z'/%3E%3C/clipPath%3E%3C/defs%3E%3Cg clip-path='url(%23heart)'%3E%3Crect width='64' height='12.8' y='0' fill='%235BCEFA'/%3E%3Crect width='64' height='12.8' y='12.8' fill='%23F5A9B8'/%3E%3Crect width='64' height='12.8' y='25.6' fill='%23FFFFFF'/%3E%3Crect width='64' height='12.8' y='38.4' fill='%23F5A9B8'/%3E%3Crect width='64' height='12.8' y='51.2' fill='%235BCEFA'/%3E%3C/g%3E%3C/svg%3E">
  <title>transgende.rs</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    .trans-flag {
      width: 100vw;
      height: 100dvh;
      background: linear-gradient(
        to bottom,
        #5BCEFA 0%,   #5BCEFA 20%,
        #F5A9B8 20%,  #F5A9B8 40%,
        #FFFFFF 40%,  #FFFFFF 60%,
        #F5A9B8 60%,  #F5A9B8 80%,
        #5BCEFA 80%,  #5BCEFA 100%
      );
      display: flex;
      flex-direction: column;
    }

    .stripe {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: center;
      width: 100%;
      padding: 0 1rem;
      min-height: 0;
    }

    .flag-text {
      font-weight: 900;
      font-size: clamp(3rem, 14vw, 6.5rem);
      color: #ececec;
      letter-spacing: -0.05em;
      text-align: center;
      margin: 0;
      line-height: 0.9;
      max-width: 96%;
      white-space: normal;
      overflow-wrap: anywhere;
      text-wrap: balance;
    }

    .links-container {
      display: flex;
      gap: 1rem;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      width: 100%;
      padding: 0 0.5rem;
    }

    .flag-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 56px;
      min-width: 56px;
      font-weight: 800;
      font-size: clamp(1.3rem, 5.8vw, 2rem);
      color: #fff;
      text-decoration: none;
      padding: 1.1rem 1.6rem;
      background: rgba(255, 255, 255, 0.28);
      border-radius: 16px;
      transition: background 0.2s ease, transform 0.2s ease;
      white-space: normal;
      text-align: center;
      line-height: 1.05;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    .flag-link:hover {
      background: rgba(255, 255, 255, 0.45);
      transform: translateY(-2px);
    }

    .flag-link:active {
      transform: translateY(0);
    }

    .bottom-blue {
      position: relative;
    }

    .copyright {
      position: absolute;
      bottom: 0.75rem;
      left: 50%;
      transform: translateX(-50%);
      font-size: clamp(0.85rem, 3.2vw, 1.1rem);
      font-weight: 600;
      color: rgba(255, 255, 255, 0.85);
      text-align: center;
      white-space: nowrap;
      pointer-events: none;
    }

    @media (max-width: 480px) {
      .stripe {
        padding: 0 0.75rem;
      }

      .flag-text {
        font-size: clamp(3.6rem, 16vw, 5.6rem);
      }

      .links-container {
        flex-direction: column;
        gap: 1.1rem;
      }

      .flag-link {
        width: min(100%, 390px);
        font-size: clamp(1.35rem, 6.5vw, 1.85rem);
        padding: 1.2rem 1.5rem;
      }
    }

    @media (max-width: 360px) {
      .flag-text {
        font-size: clamp(3.2rem, 15vw, 4.8rem);
      }

      .flag-link {
        width: 100%;
        font-size: 1.3rem;
        padding: 1.15rem 1.3rem;
      }
    }
  </style>
</head>
<body>
  <div class="trans-flag" role="img" aria-label="trans flag">
    <div class="stripe"></div>
    <div class="stripe"></div>

    <div class="stripe">
      <h1 class="flag-text">transgende.rs &lt;3</h1>
    </div>

    <div class="stripe">
      <nav class="links-container" aria-label="links">
        <a href="https://glaad.org/transgender/resources/" class="flag-link" target="_blank" rel="noopener">GLAAD</a>
        <a href="https://www.hrc.org/resources/transgender" class="flag-link" target="_blank" rel="noopener">HRC</a>
        <a href="https://www.pointofpride.org/" class="flag-link" target="_blank" rel="noopener">Point of Pride</a>
      </nav>
    </div>

    <div class="stripe bottom-blue">
      <div class="copyright">© 2026 transgende.rs</div>
    </div>
  </div>
</body>
</html>
